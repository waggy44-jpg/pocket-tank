<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pocket Tank</title>
<meta name="theme-color" content="#05121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Tank">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --abyss:#05121c; --deep:#0a2233; --mid:#124056; --line:#1d5f7a;
  --foam:#dff3ff; --dim:#8fb6c9; --gold:#ffd479; --warn:#ff9d7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--foam);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{position:absolute;background:rgba(5,18,28,.72);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:12px;letter-spacing:.02em;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#coins{top:10px;right:10px;color:var(--gold)}
#pop{top:10px;left:10px;display:none}
#clock{top:10px;left:50%;transform:translateX(-50%);color:var(--dim);display:none}
#banner{position:absolute;left:50%;top:34%;transform:translateX(-50%);
  background:rgba(5,18,28,.92);border:1px solid var(--line);border-radius:14px;
  padding:12px 16px;text-align:center;max-width:82vw;display:none}
#banner b{display:block;font-size:15px;margin-bottom:3px}
#banner span{color:var(--dim);font-size:12px}
.panel{position:absolute;inset:0;background:rgba(3,10,16,.94);display:none;
  flex-direction:column;padding:14px 14px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel.open{display:flex}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph h2{margin:0;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.ph .sp{flex:1}
.btn{background:rgba(18,64,86,.55);border:1px solid var(--line);color:var(--foam);
  border-radius:11px;padding:9px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:active{background:rgba(29,95,122,.7)}
.btn.gold{color:var(--gold);border-color:#6b5320}
.btn.on{background:var(--line);color:#04121c}
.close{font-size:22px;line-height:1;padding:2px 10px}
.card{background:rgba(10,34,51,.72);border:1px solid var(--line);border-radius:16px;padding:14px}
.fishname{font-size:19px;font-weight:600;letter-spacing:.03em}
.stageline{color:var(--dim);font-size:12px;margin-top:2px}
.bar{height:7px;border-radius:4px;background:rgba(143,182,201,.16);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:4px}
.rows{margin-top:12px;display:grid;gap:9px}
.row{display:grid;grid-template-columns:76px 1fr 32px;align-items:center;gap:8px;font-size:12px}
.row .lab{color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.row .val{text-align:right;color:var(--dim);font-size:11px}
.goalnow{margin-top:12px;padding:9px 11px;border:1px dashed var(--line);border-radius:11px;
  font-size:12px;color:var(--dim)}
.goalnow b{color:var(--gold)}
.tools{display:flex;gap:8px;margin-top:12px}
.tools .btn{flex:1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.item{background:rgba(10,34,51,.72);border:1px solid var(--line);border-radius:14px;padding:11px}
.item.locked{opacity:.45}
.item h3{margin:0 0 3px;font-size:13px}
.item p{margin:0;font-size:11px;color:var(--dim);line-height:1.35}
.price{margin-top:7px;font-size:12px;color:var(--gold)}
.badges{display:grid;gap:8px;margin-top:8px}
.badge{display:flex;align-items:center;gap:10px;background:rgba(10,34,51,.6);
  border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px}
.badge .dot{width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:rgba(143,182,201,.14);display:grid;place-items:center;font-size:13px}
.badge.off{color:#4d6d7e}
.badge.off .dot{filter:grayscale(1) brightness(.55)}
.badge.fresh{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,212,121,.3)}
.note{color:var(--dim);font-size:11px;line-height:1.45;margin-top:10px}
.state{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:#7fb9d0;
  background:rgba(3,10,16,.6);border:1px solid var(--line);border-radius:10px;
  padding:8px 9px;margin-top:10px;word-break:break-all;line-height:1.5}
.setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(29,95,122,.35);font-size:13px}
.setrow .sp{flex:1}
input[type=range]{width:120px;accent-color:var(--line)}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  color:var(--dim);font-size:11px;text-align:center;background:rgba(5,18,28,.6);
  padding:5px 12px;border-radius:999px;transition:opacity .6s}
.wheel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.wheel button{font-size:22px;padding:11px 0}
.swatches{display:flex;gap:9px;margin-top:12px;justify-content:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent}
.sw.sel{border-color:#fff}
.center{margin-top:20px;text-align:center}
.namerow{display:flex;align-items:center;gap:10px;margin-top:10px}
.namerow input{flex:1;min-width:0;background:rgba(3,10,16,.7);border:1px solid var(--line);
  color:var(--foam);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="chip" id="pop"></div>
    <div class="chip" id="coins"></div>
    <div class="chip" id="clock"></div>
    <div id="banner"><b></b><span></span></div>
    <div class="hint" id="hint">tap the surface to feed &middot; hold to befriend &middot; swipe to clean</div>
  </div>

  <div class="panel" id="pCard">
    <div class="ph"><h2>Fish card</h2><div class="sp"></div><button class="btn close" data-close>&times;</button></div>
    <div class="card" id="cardBody"></div>
    <div class="tools">
      <button class="btn" id="tSponge">Sponge</button>
      <button class="btn" id="tScissors">Scissors</button>
      <button class="btn" id="tDone">Done</button>
    </div>
    <div class="center"><button class="btn" id="toMore">MORE &rsaquo;</button></div>
    <div class="note" id="cardNote"></div>
    <div class="state" id="stateLine"></div>
  </div>

  <div class="panel" id="pMore">
    <div class="ph"><h2>Milestones</h2><div class="sp"></div><button class="btn close" data-close>&times;</button></div>
    <div id="moreBody"></div>
  </div>

  <div class="panel" id="pShop">
    <div class="ph"><h2>Shop</h2><div class="sp"></div><button class="btn close" data-close>&times;</button></div>
    <div class="grid" id="shopBody"></div>
    <div class="note">Care earns sand dollars. What you buy, you place yourself.</div>
  </div>

  <div class="panel" id="pSet">
    <div class="ph"><h2>Settings</h2><div class="sp"></div><button class="btn close" data-close>&times;</button></div>
    <div class="setrow"><span>Brightness</span><div class="sp"></div><input type="range" id="sBri" min="20" max="100" value="100"></div>
    <div class="setrow"><span>Sound</span><div class="sp"></div><input type="range" id="sVol" min="0" max="100" value="55"></div>
    <div class="setrow"><span>Lights out</span><div class="sp"></div><button class="btn" id="sLights">Double-tap</button></div>
    <div class="center"><button class="btn gold" id="sReset">Start a new tank</button></div>
  </div>

  <div class="panel" id="pName">
    <div class="ph"><h2>Meet your fry</h2></div>
    <div class="card" id="nameBody"></div>
    <div class="note">Two fry, as every tank starts. Name them, pick a colour, then place your bubbles on the glass.</div>
    <div class="center"><button class="btn" id="nameGo">Put them in</button></div>
  </div>
</div>
<script>
"use strict";
